# JuleHygge: Spanish as it is spoken in Mexico. Only the texts that differ from es.ini are here: everything
# else is taken from es.ini, then from en.ini (see assets/sprog/README.md, "Regional variants").

@name = Español (México)

Drage = Papalote
Julemanden = Santa Claus
Send julemanden afsted nu! = ¡Enviar a Santa Claus ahora!
Lyd: bjælder og jingle når julemanden flyver = Sonido: cascabeles y una melodía cuando vuela Santa Claus
Send julemanden ind i kameraet = Enviar a Santa Claus a la cámara
Løvsuger rydder bladene = La aspiradora de hojas retira las hojas
Løvsuger rydder proceslinjen = La aspiradora de hojas limpia la barra de tareas
Løvsuger rydder panelet = La aspiradora de hojas limpia el panel
Send løvsugeren ud nu! = ¡Sacar la aspiradora de hojas ahora!
Lyd: motor, sug og horn fra løvsugeren = Sonido: motor, succión y claxon de la aspiradora de hojas
Lyd: motor, skraben og horn fra sneploven = Sonido: motor, raspado y claxon de la quitanieves
Send løvsugeren ind i kameraet = Enviar la aspiradora de hojas a la cámara
Kun når den bærbare kører på batteri = Solo cuando la laptop funciona con batería
Blomsterkrans i håret i kameraet = Corona de flores en el cabello en la cámara
