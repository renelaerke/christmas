# JuleHygge: the menu's texts in English.
#
# One text per line:   Danish text = text in this language
# The Danish text on the left is the key: it must stay exactly as it is. Translate the right-hand side only.
# {0} and {1} stand for a number or a name that the app puts in; keep them.
# A text that is missing here is shown in English.
#
# A new language: copy en.ini to xx.ini (xx = the language's two-letter code, as in "fr"), change @name and
# translate the right-hand sides. See assets/sprog/README.md.

@name = English

