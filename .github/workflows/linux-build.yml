# Builds and tests the Linux version (linux/) on every push to main or linux-port and on every pull request
# that touches it, and keeps the release tarball and a snapshot of the snow as a workflow artifact (version
# 0.0.0). For a published release, or when release.yml (the "Make release" button) calls it with the new tag, the
# binary is stamped with the tag (v1.4.0 -> 1.4.0) and JuleHygge-linux-x86_64.tar.gz is attached to the release.
# The app's self-update only installs a binary whose version matches its release tag, so release tarballs must
# come from this workflow, not from a local build.
#
# Built on Ubuntu 22.04 so the binary runs on Ubuntu 22.04+ and Linux Mint 21+ (glibc). The smoke test runs the
# app under Xvfb with --snapshot (Xvfb has no compositor, so no windows are shown, but the scene is drawn).
name: Linux build

on:
  push:
    branches: [main, linux-port]
    paths: ['linux/**', '.github/workflows/linux-build.yml']
  pull_request:
    paths: ['linux/**', '.github/workflows/linux-build.yml']
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to stamp and attach to (e.g. v1.4.1)
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write   # needed to upload the tarball to the release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcairo2-dev libpango1.0-dev libasound2-dev xvfb xauth

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target
          key: linux-${{ hashFiles('linux/Cargo.toml', 'linux/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check || echo "::warning::cargo fmt would change files"

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

      # A release is stamped with its tag; any other run stays 0.0.0 (a developer build that never updates itself).
      - name: Version
        id: ver
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          v=0.0.0
          if [ -n "$TAG" ]; then v="${TAG#v}"; v="${v#V}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must look like v1.2.3, got '$TAG'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./build.sh
          stamped=$(build/JuleHygge --version)
          echo "$stamped"
          [ "$stamped" = "JuleHygge ${{ steps.ver.outputs.version }}" ] || { echo "Version stamp missing"; exit 1; }
          tar -tzvf build/JuleHygge-linux-x86_64.tar.gz
          sha256sum build/JuleHygge-linux-x86_64.tar.gz

      - name: Install test (in a scratch home, without starting)
        run: |
          home="$RUNNER_TEMP/home" && mkdir -p "$home/pkg"
          tar -xzf build/JuleHygge-linux-x86_64.tar.gz -C "$home/pkg"
          HOME="$home" "$home/pkg/install.sh" --no-start
          test -x "$home/.local/share/JuleHygge/JuleHygge"
          test -s "$home/.local/share/icons/hicolor/256x256/apps/julehygge.png"
          grep -q '^Exec=' "$home/.local/share/applications/julehygge.desktop"
          test ! -e "$home/.config/autostart/julehygge.desktop"
          HOME="$home" "$home/pkg/install.sh" --uninstall
          test ! -e "$home/.local/share/JuleHygge"

      - name: Smoke test under Xvfb
        run: |
          export JULE_DEBUG=1 JULE_SETTINGS="$RUNNER_TEMP/test.ini" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 10 build/JuleHygge --snapshot="$RUNNER_TEMP/shots,4"
          code=$?
          set -e
          echo "exit code $code (124 = stopped by timeout, as expected)"
          cat "$XDG_RUNTIME_DIR/julehygge-debug.log" || true
          [ "$code" = 124 ] || exit 1
          ls -l "$RUNNER_TEMP/shots"
          test -s "$RUNNER_TEMP/shots/screen0.png"
          cp "$RUNNER_TEMP/shots/screen0.png" build/
          # the same in the autumn theme, with a full pile, the finished scarecrow, the geese on their way and
          # the leaf collector at work, in a storm (rain), kept as a second picture to look at
          printf 'Theme=1\nFirstRun=2020-01-01\nSnowLevel=2\n' > "$RUNNER_TEMP/efteraar.ini"
          set +e
          JULE_SETTINGS="$RUNNER_TEMP/efteraar.ini" JULE_DEEPSNOW=1 xvfb-run -a -s "-screen 0 1920x1080x24" timeout 14 build/JuleHygge --santa --plow=1 --snapshot="$RUNNER_TEMP/shots-efteraar,7"
          code=$?
          set -e
          [ "$code" = 124 ] || exit 1
          test -s "$RUNNER_TEMP/shots-efteraar/screen0.png"
          cp "$RUNNER_TEMP/shots-efteraar/screen0.png" build/screen0-efteraar.png
          # the same on De dødes dag: a carpet of petals, the finished ofrenda (11 hours of running), papel picado,
          # calacas, the butterflies on their way and the donkey cart at work (it walks slowly, so a little later)
          printf 'Theme=2\nOfrendaSeconds=39600\nSnowLevel=2\n' > "$RUNNER_TEMP/muertos.ini"
          set +e
          JULE_SETTINGS="$RUNNER_TEMP/muertos.ini" JULE_DEEPSNOW=1 xvfb-run -a -s "-screen 0 1920x1080x24" timeout 17 build/JuleHygge --santa --plow=1 --snapshot="$RUNNER_TEMP/shots-muertos,10"
          code=$?
          set -e
          [ "$code" = 124 ] || exit 1
          test -s "$RUNNER_TEMP/shots-muertos/screen0.png"
          cp "$RUNNER_TEMP/shots-muertos/screen0.png" build/screen0-muertos.png
          # and on Halloween, once with each form of the plow: the finished jack-o'-lanterns, the string of pumpkins
          # and bats, ghosts and children dressed up, the witch flying, and the witch sweeping or the ghosts blowing
          printf 'Theme=3\nOfrendaSeconds=39600\nSnowLevel=1\nNisseCount=8\n' > "$RUNNER_TEMP/halloween.ini"
          for form in heks spoegelser; do
            set +e
            JULE_SETTINGS="$RUNNER_TEMP/halloween.ini" JULE_DEEPSNOW=1 JULE_HALLOWEEN_PLOV=$form xvfb-run -a -s "-screen 0 1920x1080x24" timeout 17 build/JuleHygge --santa --plow=1 --snapshot="$RUNNER_TEMP/shots-halloween-$form,10"
            code=$?
            set -e
            [ "$code" = 124 ] || exit 1
            test -s "$RUNNER_TEMP/shots-halloween-$form/screen0.png"
            cp "$RUNNER_TEMP/shots-halloween-$form/screen0.png" "build/screen0-halloween-$form.png"
          done
          # and at New Year: the decorated clock, the pennants and paper lanterns, the guests, a volley of rockets
          # and the street sweeper; and once more with midnight six seconds after the start (JULE_NYTAAR_OM): the
          # guests round the clock, the big volley and the new year's number in sparks
          printf 'Theme=4\nOfrendaSeconds=39600\nSnowLevel=1\nNisseCount=8\n' > "$RUNNER_TEMP/nytaar.ini"
          for shot in nytaar nytaar-midnat; do
            om=""; extra="--santa --plow=1"
            if [ "$shot" = nytaar-midnat ]; then om=6; extra=""; fi
            set +e
            JULE_SETTINGS="$RUNNER_TEMP/nytaar.ini" JULE_DEEPSNOW=1 ${om:+JULE_NYTAAR_OM=$om} xvfb-run -a -s "-screen 0 1920x1080x24" timeout 17 build/JuleHygge $extra --snapshot="$RUNNER_TEMP/shots-$shot,10"
            code=$?
            set -e
            [ "$code" = 124 ] || exit 1
            test -s "$RUNNER_TEMP/shots-$shot/screen0.png"
            cp "$RUNNER_TEMP/shots-$shot/screen0.png" "build/screen0-$shot.png"
          done
          # the children's snowman at three points of its story, to look at: being dressed, the snowball fight,
          # and the plow just after it has run the snowman down (the blade reaches x=900 about 6.5 s in)
          printf 'FirstRun=2020-01-01\nSnowLevel=1\nSanta=0\nNisseCount=8\n' > "$RUNNER_TEMP/snemand.ini"
          for shot in snemand:860,900:4: sneboldkamp:898,900:14: snemand-plov:898,900:7:--plow=1; do
            IFS=: read -r name start secs extra <<< "$shot"
            set +e
            JULE_SETTINGS="$RUNNER_TEMP/snemand.ini" JULE_DEEPSNOW=1 JULE_SNOWMAN_START="$start" xvfb-run -a -s "-screen 0 1920x1080x24" timeout $((secs + 6)) build/JuleHygge $extra --snapshot="$RUNNER_TEMP/shots-$name,$secs"
            code=$?
            set -e
            [ "$code" = 124 ] || exit 1
            test -s "$RUNNER_TEMP/shots-$name/screen0.png"
            cp "$RUNNER_TEMP/shots-$name/screen0.png" "build/screen0-$name.png"
          done
          grep 'snowman:' "$XDG_RUNTIME_DIR/julehygge-debug.log"
          grep -q 'snowman: run down by the plow' "$XDG_RUNTIME_DIR/julehygge-debug.log"
          # who the walkers are (setting Folk): the rule by language and region, and a picture of each folk but
          # the nisser (who are in the first picture) to look at
          JULE_LOCALE=en_US build/JuleHygge --folk-test | tee "$RUNNER_TEMP/folk.txt"
          grep -q '^This machine: language en, region US -> alfer' "$RUNNER_TEMP/folk.txt"
          JULE_LOCALE=en_DK build/JuleHygge --folk-test | grep -q -- '-> nisser'
          JULE_LOCALE=de_AT build/JuleHygge --folk-test | grep -q -- '-> wichtel'
          for folk in 2:alfer 3:wichtel 4:kabouter 5:paekapikk; do
            name="${folk#*:}"
            printf 'Folk=%s\nNisseCount=12\nFirstRun=2020-01-01\nSnowLevel=0\n' "${folk%%:*}" > "$RUNNER_TEMP/$name.ini"
            set +e
            JULE_SETTINGS="$RUNNER_TEMP/$name.ini" xvfb-run -a -s "-screen 0 1920x1080x24" timeout 10 build/JuleHygge --snapshot="$RUNNER_TEMP/shots-$name,4"
            code=$?
            set -e
            [ "$code" = 124 ] || exit 1
            test -s "$RUNNER_TEMP/shots-$name/screen0.png"
            cp "$RUNNER_TEMP/shots-$name/screen0.png" "build/screen0-$name.png"
          done
          # the menu's languages: the files are complete and match the code, and the automatic choice follows
          # the machine's language, with English for one that has no file
          python3 "$GITHUB_WORKSPACE/tools/sprog-check.py"
          JULE_LOCALE=de_DE build/JuleHygge --sprog-test | tee "$RUNNER_TEMP/sprog.txt"
          grep -q '^Automatic on this machine: de ' "$RUNNER_TEMP/sprog.txt"
          JULE_LOCALE=pl_PL build/JuleHygge --sprog-test | grep -q '^Automatic on this machine: en '
          # the sounds, written as files: the summary shows that the goose recording was read
          build/JuleHygge --sound-test="$RUNNER_TEMP/lyd"
          cat "$RUNNER_TEMP/lyd/summary.txt"
          grep -q '^gaes-alene: [1-9]' "$RUNNER_TEMP/lyd/summary.txt"
          # (De dødes dag: the butterflies' tune is 16 bars, and the donkey cart's loop 8 steps of the donkey)
          grep -q '^sommerfugle-son: 18\.' "$RUNNER_TEMP/lyd/summary.txt"
          grep -q '^aeselkaerre-rul: 4\.' "$RUNNER_TEMP/lyd/summary.txt"
          grep -q '^heks-melodi: 10\.' "$RUNNER_TEMP/lyd/summary.txt"
          grep -q '^spoegelser-sus: 4\.0' "$RUNNER_TEMP/lyd/summary.txt"

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: JuleHygge-linux
          path: |
            linux/build/JuleHygge-linux-x86_64.tar.gz
            linux/build/screen0.png
            linux/build/screen0-efteraar.png
            linux/build/screen0-muertos.png
            linux/build/screen0-halloween-heks.png
            linux/build/screen0-halloween-spoegelser.png
            linux/build/screen0-nytaar.png
            linux/build/screen0-nytaar-midnat.png
            linux/build/screen0-alfer.png
            linux/build/screen0-wichtel.png
            linux/build/screen0-kabouter.png
            linux/build/screen0-paekapikk.png
            linux/build/screen0-snemand.png
            linux/build/screen0-sneboldkamp.png
            linux/build/screen0-snemand-plov.png
            linux/Cargo.lock

      - name: Attach to the release
        if: inputs.tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" build/JuleHygge-linux-x86_64.tar.gz --clobber
