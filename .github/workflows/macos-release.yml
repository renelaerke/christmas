# Builds the macOS app (universal: Apple Silicon + Intel) with macos/build.sh and attaches it as
# JuleHygge-macOS.zip to the GitHub release. Runs when a release is published (e.g. `gh release create`),
# when called by release.yml (the "Make release" button) with the new tag, or by hand from the Actions tab
# (then the zip is only kept as a workflow artifact).
#
# The app is ad-hoc signed like a local build, so on first launch macOS asks for confirmation
# (right-click > Open, or System Settings > Privacy & Security > Open Anyway). The JuleHygge Kamera
# extension is not included: it needs the team's Apple Development certificate (see macos/xcbuild.sh).
name: macOS build

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to stamp and attach to (e.g. v1.4.1)
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: write   # needed to upload the zip to the release

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # A release is stamped with its tag (v1.4.0 -> 1.4.0): the app's self-update only installs an app whose
      # version matches the release tag. A manual run stays 0.0.0 (a developer build that never updates itself).
      - name: Version
        id: ver
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          v=0.0.0
          if [ -n "$TAG" ]; then v="${TAG#v}"; v="${v#V}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must look like v1.2.3, got '$TAG'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build JuleHygge.app (universal)
        working-directory: macos
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh

      - name: Check and zip
        working-directory: macos/build
        run: |
          lipo -info JuleHygge.app/Contents/MacOS/JuleHygge
          codesign --verify --deep --strict --verbose JuleHygge.app
          stamped=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' JuleHygge.app/Contents/Info.plist)
          echo "version: $stamped"
          [ "$stamped" = "${{ steps.ver.outputs.version }}" ] || { echo "Version stamp missing"; exit 1; }
          ditto -c -k --keepParent JuleHygge.app JuleHygge-macOS.zip
          shasum -a 256 JuleHygge-macOS.zip

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: JuleHygge-macOS
          path: macos/build/JuleHygge-macOS.zip

      - name: Attach to the release
        if: inputs.tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" macos/build/JuleHygge-macOS.zip --clobber
